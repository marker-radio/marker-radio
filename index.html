<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Marker Radio</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; text-align: center; padding-top: 40px; }
    #start { font-size: 1.2rem; padding: 12px 24px; border: none; border-radius: 8px; background: #2a6df4; color: white; cursor: pointer; }
    #start:hover { background: #1f54c4; }
    #status { margin-top: 20px; font-size: 1.1rem; color: #888; }
    #status.live { color: #3ddc84; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Marker Radio</h1>
  <button id="start">Start the radio</button>
  <div id="status">IDLE</div>
  <script src="js/app.js"></script>
</body>
</html>
